name: Android APK

# Manual runs are always possible; PRs against main build a private test APK.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build standalone test APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPO_NO_TELEMETRY: '1'
      NDK_VERSION: '27.1.12297006'
      CMAKE_VERSION: '3.22.1'
      COMPILE_SDK: '35'
      BUILD_TOOLS: '35.0.0'
      ABI: arm64-v8a
      # The test APK uses its own application id so it can be installed next to
      # an already installed Back15 signed with a different key.
      TEST_APPLICATION_ID: com.egawilldoit.back15.test
      TEST_APP_NAME: Back15 Test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Pin Node and pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Pin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-${COMPILE_SDK}" \
            "platforms;android-36" \
            "build-tools;${BUILD_TOOLS}" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}" >/dev/null
          if [ -n "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'app.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm run test

      - name: Apply the test application identity
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            config.expo.name = process.env.TEST_APP_NAME;
            config.expo.android.package = process.env.TEST_APPLICATION_ID;
            fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          "
          grep -n '"package"' app.json

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Prepare durable test signing
        env:
          KEYSTORE_BASE64: ${{ secrets.BACK15_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BACK15_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BACK15_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BACK15_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          check_secret() {
            if [ -z "$2" ]; then
              missing="$missing $1"
            fi
          }
          check_secret BACK15_KEYSTORE_BASE64 "$KEYSTORE_BASE64"
          check_secret BACK15_KEYSTORE_PASSWORD "$KEYSTORE_PASSWORD"
          check_secret BACK15_KEY_ALIAS "$KEY_ALIAS"
          check_secret BACK15_KEY_PASSWORD "$KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Create the durable private-test keystore and add these secrets (see docs/mvp/test-signing.md). The job will not generate a throwaway key, because that would break future in-place updates."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/back15-test.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::BACK15_KEYSTORE_BASE64 did not decode to a keystore file."
            exit 1
          fi
          keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          # The generated android project is gitignored; the keystore stays in
          # the runner temp directory and is never uploaded.
          {
            echo ""
            echo "android.injected.signing.store.file=$KEYSTORE"
            echo "android.injected.signing.store.password=$KEYSTORE_PASSWORD"
            echo "android.injected.signing.key.alias=$KEY_ALIAS"
            echo "android.injected.signing.key.password=$KEY_PASSWORD"
          } >> android/gradle.properties

      - name: Build release APK
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --console=plain \
            -PreactNativeArchitectures="${ABI}"

      - name: Verify APK and record evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK_DIR="android/app/build/outputs/apk/release"
          if [ ! -d "$APK_DIR" ]; then
            echo "::error::No APK output directory at $APK_DIR"
            exit 1
          fi
          APK="$(find "$APK_DIR" -maxdepth 1 -name '*.apk' -type f | sort | head -n 1)"
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::No APK produced in $APK_DIR"
            exit 1
          fi
          SIZE="$(stat -c%s "$APK")"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::APK is unexpectedly small (${SIZE} bytes)"
            exit 1
          fi
          unzip -l "$APK" > "$RUNNER_TEMP/apk-listing.txt"
          grep -q 'classes.dex' "$RUNNER_TEMP/apk-listing.txt" || { echo "::error::APK has no classes.dex"; exit 1; }
          grep -q 'assets/index.android.bundle' "$RUNNER_TEMP/apk-listing.txt" || { echo "::error::APK has no embedded JS bundle; it would need Metro"; exit 1; }

          APKSIGNER="$(find "${ANDROID_HOME}" -path '*build-tools*' -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found; refusing to report an unverified signature."
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK" | tee artifacts/signing.txt
          CERT_SHA256="$(sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' artifacts/signing.txt | head -n 1)"
          CERT_SHA1="$(sed -n 's/^V2 Signer: certificate SHA-1 digest: //p' artifacts/signing.txt | head -n 1)"
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::Could not read the signing certificate digest."
            exit 1
          fi

          AAPT2="$(find "${ANDROID_HOME}" -path '*build-tools*' -name 'aapt2' -type f | sort -V | tail -n 1)"
          PACKAGE_ID=""
          if [ -n "$AAPT2" ]; then
            PACKAGE_ID="$("$AAPT2" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          fi
          if [ -z "$PACKAGE_ID" ]; then
            PACKAGE_ID="$(unzip -p "$APK" AndroidManifest.xml | strings -e l | grep -oE 'com\.egawilldoit\.back15(\.test)?' | head -n 1)"
          fi
          if [ "$PACKAGE_ID" != "$TEST_APPLICATION_ID" ]; then
            echo "::error::APK package id is '${PACKAGE_ID}', expected '${TEST_APPLICATION_ID}'."
            exit 1
          fi

          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SHORT_SHA="${HEAD_SHA::12}"
          FNAME="back15-${SHORT_SHA}-test.apk"
          cp "$APK" "artifacts/$FNAME"
          {
            echo "commit_sha=$HEAD_SHA"
            echo "apk_filename=$FNAME"
            echo "package_id=$PACKAGE_ID"
            echo "signing_cert_sha256=$CERT_SHA256"
            echo "signing_cert_sha1=$CERT_SHA1"
            echo "size_bytes=$SIZE"
            echo "sha256=$SHA256"
            echo "abi=$ABI"
            echo "signed=durable private-test keystore from repository secrets (never committed)"
          } > artifacts/apk-info.txt
          {
            echo "## Back15 test APK"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| commit | \`$HEAD_SHA\` |"
            echo "| package id | \`$PACKAGE_ID\` |"
            echo "| file | \`$FNAME\` |"
            echo "| size | $SIZE bytes ($(( SIZE / 1024 / 1024 )) MiB) |"
            echo "| apk sha256 | \`$SHA256\` |"
            echo "| signing cert sha256 | \`$CERT_SHA256\` |"
            echo "| ABI | $ABI |"
            echo "| standalone | yes — JS bundle embedded, no Metro needed |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/apk-info.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: back15-test-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error
